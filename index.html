<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HappyPlace">
<meta name="description" content="A research-based daily well-being checklist for you and your family. Private: everything stays on your device.">
<title>HappyPlace</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="icon.svg" alt="" width="28" height="28">
    <span>HappyPlace</span>
  </div>
  <button id="profileBtn" class="profile-btn" aria-label="Switch person"></button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Main">
  <a href="#today" data-tab="today"><span aria-hidden="true">☀️</span>Today</a>
  <a href="#move" data-tab="move"><span aria-hidden="true">🏃</span>Move</a>
  <a href="#plate" data-tab="plate"><span aria-hidden="true">🥗</span>Plate</a>
  <a href="#insights" data-tab="insights"><span aria-hidden="true">📈</span>Insights</a>
  <a href="#plan" data-tab="plan"><span aria-hidden="true">🧩</span>My plan</a>
</nav>

<div id="sheet" class="sheet" hidden></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
